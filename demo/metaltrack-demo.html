<title>METALTRACK Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral fija + área de trabajo. Sistema visual de la propuesta: marino #0B1426/#12244A, azul eléctrico #1F5BFF solo para acción y proceso actual, esquinas 4px, sin sombras. */
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#E9ECF1;color:#101828;font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
a{color:#1546C9}
button{font:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;font-feature-settings:"zero" 1}
.mt-shell{display:flex;min-height:100vh}
.mt-side{flex:0 0 216px;width:216px;background:#0B1426;color:#A9B4C9;padding:16px 10px;display:flex;flex-direction:column;gap:20px}
.mt-main{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.mt-nav{display:flex;flex-direction:column;gap:2px}
.mt-n{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:3px;border-left:2px solid transparent;color:#A9B4C9;text-decoration:none;font-size:13px;font-weight:500;transition:background .12s,color .12s}
.mt-n:hover{background:#13203A;color:#fff}
.mt-n.is-on{background:#16264A;color:#fff;border-left-color:#5B8CFF}
.mt-hd{font-size:10px;letter-spacing:.12em;color:#7C89A2;font-weight:600;padding:10px 10px 4px}
.mt-b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:4px;border:1px solid #C3CBD9;background:#fff;color:#101828;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:background .12s,border-color .12s}
.mt-b:hover{background:#F3F5F9;border-color:#9AA6BB;color:#101828}
.mt-b.pri{background:#1F5BFF;border-color:#1F5BFF;color:#fff}
.mt-b.pri:hover{background:#1546C9;border-color:#1546C9;color:#fff}
.mt-b.sm{height:30px;padding:0 10px;font-size:12px}
.mt-b[disabled]{background:#F1F3F7;border-color:#E4E8EF;color:#7C89A2;cursor:not-allowed}
.mt-b:focus-visible,.mt-in:focus-visible,.mt-n:focus-visible,.mt-chip:focus-visible,.mt-cat:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid #1F5BFF;outline-offset:2px}
.mt-in{height:36px;width:100%;padding:0 10px;border:1px solid #C3CBD9;border-radius:4px;background:#fff;font:inherit;font-size:13px;color:#101828}
.mt-in[readonly]{background:#F6F7FA}
textarea.mt-in{height:auto;padding:8px 10px;resize:vertical}
.mt-chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:4px;border:1px solid #C3CBD9;background:#fff;font-size:13px;font-weight:500;cursor:pointer;color:#101828;transition:background .12s}
.mt-chip:hover{background:#F3F5F9}
.mt-chip.is-on{background:#12244A;border-color:#12244A;color:#fff}
.mt-pn{background:#fff;border:1px solid #D3D9E3;border-radius:4px;min-width:0}
.mt-ph{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-bottom:1px solid #E4E8EF;font-size:11px;font-weight:700;letter-spacing:.08em;color:#12244A;text-transform:uppercase}
.mt-tbl{width:100%;border-collapse:collapse}
.mt-tbl th{height:34px;padding:0 12px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.04em;color:#536079;background:#F6F7FA;border-bottom:1px solid #E4E8EF;white-space:nowrap}
.mt-tbl td{height:46px;padding:0 12px;border-top:1px solid #E4E8EF}
.mt-tbl tbody tr:first-child td{border-top:0}
.mt-tr{transition:background .12s}
.mt-tr:hover{background:#F3F6FC}
.mt-tr[data-a]{cursor:pointer}
.mt-seg{display:flex;gap:2px;flex:1;min-width:56px}
.mt-seg i{flex:1;height:6px;border-radius:1px;display:block}
.mt-cat{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid #C3CBD9;border-radius:4px;background:#fff;font-size:13px;font-weight:500;cursor:pointer;color:#101828;transition:background .12s,border-color .12s}
.mt-cat:hover{background:#F3F6FC;border-color:#1F5BFF}
.mt-cat[disabled]{background:#F1F3F7;color:#7C89A2;border-color:#E4E8EF;cursor:default}
.mt-route{transition:background .12s}
.mt-route:hover{background:#F3F6FC}
.mt-ib{width:28px;height:28px;border:0;background:transparent;border-radius:3px;cursor:pointer;color:#536079;display:flex;align-items:center;justify-content:center}
.mt-ib:hover{background:#E4E8EF;color:#101828}
.mt-ib[disabled]{opacity:.35;cursor:default;background:transparent}
.mt-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 28px;background:#fff;border-bottom:1px solid #D3D9E3}
.mt-pg{padding:20px 28px 28px;display:flex;flex-direction:column;gap:16px}
.lb{font-size:11px;font-weight:600;color:#536079}
.fld{display:flex;flex-direction:column;gap:4px}
.rq{color:#C0291B}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:13px;color:#536079;margin-top:2px}
.msg{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:4px;font-size:13px;font-weight:500}
.msg.ok{background:#EAF6F2;border:1px solid #BFE3D9;color:#0B6B58}
.msg.err{background:#FEF3F2;border:1px solid #FBD5D1;color:#B42318}
.empty{padding:28px 16px;text-align:center;color:#536079;font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;background:#E4EBF3;color:#12244A;white-space:nowrap}
@media(max-width:1100px){.mt-n{height:44px}.mt-b,.mt-in,.mt-cat{height:44px}.mt-b.sm{height:40px}.mt-chip{height:40px}.mt-tbl td{height:56px}.mt-route{min-height:52px!important}}
@media(max-width:860px){.mt-shell{flex-direction:column}.mt-side{flex:none;width:100%;padding:10px 12px;flex-direction:row;align-items:center;gap:12px}.mt-brand small,.mt-sidefoot,.mt-hd{display:none}.mt-nav{flex-direction:row;overflow-x:auto;flex:1}.mt-n{white-space:nowrap}.mt-top{padding:8px 16px}.mt-pg{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div id="app"></div>
<script>
(function () {
'use strict';
var KEY = 'metaltrack-demo-v1';
var DAY = 864e5, HOUR = 36e5;
var pad = function (n) { return String(n).padStart(2, '0'); };

var parseD = function (s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]).getTime() : null; };

var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

/* ---------- Datos de ejemplo ---------- */
function seed() {
  var T = TODAY(), now = Date.now();

    [2, 'Buje de bronce', 'Cliente A', 42, -26, ['Corte', 'Torneado', 'Rectificado', 'Inspección'], 4, 0, 27],
    [3, 'Eje de transmisión', 'Cliente E', 38, -20, ['Corte', 'Torneado', 'Fresado', 'Rectificado', 'Inspección'], 5, 0, 21],
    [4, 'Placa base', 'Cliente C', 36, -16, ['Corte', 'Soldadura', 'Inspección'], 3, 0, 17],
    [5, 'Pasador guía', 'Cliente D', 33, -14, ['Corte', 'Torneado', 'Inspección'], 3, 0, 14],
    [6, 'Soporte de rodamiento', 'Cliente A', 30, -10, ['Corte', 'Fresado', 'Soldadura', 'Inspección'], 4, 0, 11],
    [7, 'Husillo trapecial', 'Cliente B', 27, -8, ['Corte', 'Torneado', 'Rectificado', 'Inspección'], 4, 0, 9],

    [9, 'Manguito de acople', 'Cliente C', 16, 3, C4, 4, 0, null],
    [10, 'Polea de aluminio', 'Cliente A', 15, 5, ['Corte', 'Fresado', 'Rectificado', 'Inspección'], 4, 0, null],
    [11, 'Carcasa de bomba', 'Cliente D', 14, 6, ['Corte', 'Fresado', 'Soldadura', 'Inspección'], 4, 0, null],

    [13, 'Chaveta DIN 6885', 'Cliente B', 12, 9, ['Corte', 'Fresado', 'Inspección'], 3, 0, null],
    [14, 'Eje escalonado', 'Cliente A', 20, -3, C4, 2, 1, null],
    [15, 'Soporte de motor', 'Cliente D', 17, -2, ['Corte', 'Soldadura', 'Inspección'], 1, 1, null],
    [16, 'Rodillo guía', 'Cliente C', 15, -1, ['Corte', 'Torneado', 'Rectificado', 'Fresado', 'Inspección'], 4, 1, null],

    [18, 'Tapa de reductor', 'Cliente E', 8, 12, ['Corte', 'Fresado', 'Rectificado', 'Inspección'], 1, 1, null],
    [19, 'Mordaza de sujeción', 'Cliente A', 7, 14, ['Corte', 'Soldadura', 'Fresado', 'Inspección'], 2, 1, null],

    [22, 'Tornillo sin fin', 'Cliente B', 4, 19, ['Corte', 'Torneado', 'Fresado', 'Rectificado', 'Inspección'], 0, 1, null],

  ];
  var orders = [], log = [];
  SP.forEach(function (r) {
    var id = 'MT-' + pad4(r[0]), entry = T - r[3] * DAY, base = entry + 8 * HOUR, names = r[5], done = r[6];
    var steps = names.map(function (name, i) {
      var s = { name: name, st: 'pend', start: null, end: null, obs: '' };
      var start = Math.min(base + i * 30 * HOUR, now - 2 * HOUR);

  return {
    v: 1, orders: orders, log: log, nextNum: 25,
    clients: ['Cliente A', 'Cliente B', 'Cliente C', 'Cliente D', 'Cliente E'],
    catalog: ['Corte', 'Torneado', 'Soldadura', 'Fresado', 'Rectificado', 'Inspección'].map(function (n) { return { name: n, active: true }; })
  };
}
function load() {
  try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1 && Array.isArray(s.orders) && Array.isArray(s.log)) return s; } catch (e) {}
  return null;
}
var S = load() || seed();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- Derivados ---------- */
var doneN = function (o) { return o.steps.filter(function (s) { return s.st === 'done'; }).length; };
var kindOf = function (o) { return o.delivered ? 'x' : doneN(o) === o.steps.length ? 'l' : o.steps.some(function (s) { return s.st !== 'pend'; }) ? 'e' : 'p'; };
var isLate = function (o) { return !o.delivered && o.due < TODAY(); };
var lateDays = function (o) { return Math.round((TODAY() - o.due) / DAY); };
var pctOf = function (o) { return Math.round(doneN(o) / o.steps.length * 100); };
var procStep = function (o) { for (var i = 0; i < o.steps.length; i++) if (o.steps[i].st === 'proc') return i; return -1; };
var curName = function (o) { var k = kindOf(o); if (k === 'x') return '—'; if (k === 'l') return 'Entrega'; var i = procStep(o); if (i >= 0) return o.steps[i].name; var j = o.steps.findIndex(function (s) { return s.st === 'pend'; }); return j >= 0 ? o.steps[j].name : '—'; };
var DOT = { p: '#7A869C', e: '#1F5BFF', l: '#0B7A66', x: '#536079' };
var SNAME = { p: 'Pendiente', e: 'En proceso', l: 'Lista p/ entregar', x: 'Entregada' };
var byId = function (id) { return S.orders.find(function (o) { return o.id === id; }); };
function segs(o) {
  var l = isLate(o);
  return '<div class="mt-seg">' + o.steps.map(function (s) { return '<i style="background:' + (s.st === 'done' ? '#12244A' : s.st === 'proc' ? (l ? '#C0291B' : '#1F5BFF') : '#CBD2DE') + '"></i>'; }).join('') + '</div>';
}
function dueTxt(o) {
  if (o.delivered) return fd(o.due);
  if (isLate(o)) return fd(o.due) + ' · −' + lateDays(o) + ' d';
  return fd(o.due);
}
function addLog(id, proc, from, to, kind, obs) { S.log.unshift({ t: Date.now(), id: id, proc: proc, from: from, to: to, kind: kind, obs: obs || '' }); }

/* ---------- Estado de interfaz ---------- */
var VIEWS = ['dashboard', 'pedido', 'piezas', 'seguimiento', 'entregas', 'bitacora', 'catalogo'];
function blankDraft() { return { client: '', entry: iso(Date.now()), due: '', piece: '', material: '', medidas: '', desc: '', obs: '', route: [] }; }
var UI = {
  route: 'dashboard', segId: null, msg: null, openHist: '', obsText: '', resetArm: false,
  piezas: { q: '', chip: 'todas', cliente: '', proc: '', sort: 'entry-desc', from: '', to: '', page: 1, sel: null },
  draft: blankDraft(),
  ent: { chip: 'por', sel: null, dt: '', obs: '' },
  bit: { q: '', type: '', page: 1 },
  cat: { name: '' }
};
var msgTimer = null;
function say(text, kind) {
  UI.msg = { text: text, kind: kind || 'ok' };
  clearTimeout(msgTimer);
  msgTimer = setTimeout(function () { UI.msg = null; render(); }, 5000);
}
function commit() { save(); render(); }

/* ---------- Iconos ---------- */
var IC = {
  dash: 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
  ped: 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M12 12v6M9 15h6',
  pie: 'M12 2 2 7l10 5 10-5zM2 17l10 5 10-5M2 12l10 5 10-5',
  seg: 'M3 3h6v6H3zM15 15h6v6h-6zM6 9v6a3 3 0 0 0 3 3h6',
  ent: 'M1 3h15v13H1zM16 8h4l3 3v5h-7zM5.5 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18.5 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
  bit: 'M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l4 2',
  cat: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6'
};
var NAV = [['Dashboard', 'dashboard', IC.dash, 'PRINCIPAL'], ['Pedidos', 'pedido', IC.ped, 'OPERACIÓN'], ['Todas las piezas', 'piezas', IC.pie, ''], ['Seguimiento', 'seguimiento', IC.seg, ''], ['Entregas', 'entregas', IC.ent, ''], ['Bitácora', 'bitacora', IC.bit, 'REGISTRO'], ['Catálogo de procesos', 'catalogo', IC.cat, 'SISTEMA']];
var svg = function (d, w, sw) { return '<svg width="' + (w || 16) + '" height="' + (w || 16) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 1.8) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"/></svg>'; };
var PLUS = 'M12 5v14M5 12h14', CHECK = 'M5 12l5 5L20 7';

/* ---------- Estructura general ---------- */
function shell(crumb, body, topExtra) {
  var nav = NAV.map(function (n) {
    return '<div>' + (n[3] ? '<div class="mt-hd">' + n[3] + '</div>' : '') + '<a href="#' + n[1] + '" class="mt-n' + (UI.route === n[1] ? ' is-on' : '') + '"' + (UI.route === n[1] ? ' aria-current="page"' : '') + '>' + svg(n[2]) + n[0] + '</a></div>';

  return '<div class="mt-shell"><aside class="mt-side">' +
    '<div class="mt-brand" style="display:flex;align-items:center;gap:10px;padding:0 6px"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M0 0h26l6 6v26H0z" fill="#1F5BFF"/><rect x="6" y="9" width="6" height="3" fill="#fff"/><rect x="14" y="9" width="6" height="3" fill="#fff"/><rect x="22" y="9" width="4" height="3" fill="#fff" opacity=".35"/><rect x="6" y="15" width="12" height="3" fill="#fff"/><rect x="20" y="15" width="6" height="3" fill="#fff" opacity=".35"/><rect x="6" y="21" width="4" height="3" fill="#fff"/><rect x="12" y="21" width="14" height="3" fill="#fff" opacity=".35"/></svg><div><div style="font-weight:700;font-size:15px;letter-spacing:.1em;color:#fff">METALTRACK</div><small style="font-size:11px;color:#7C89A2">Control de taller</small></div></div>' +
    '<nav class="mt-nav" aria-label="Principal">' + nav + '</nav>' +
    '<div class="mt-sidefoot" style="margin-top:auto;padding:10px;border-top:1px solid #1B2A47;font-size:12px;color:#7C89A2;display:flex;flex-direction:column;gap:8px">Sesión: encargado de taller<button type="button" data-a="reset" style="height:30px;border:1px solid #2A3A5C;background:transparent;color:#A9B4C9;border-radius:4px;cursor:pointer;font-size:12px">' + (UI.resetArm ? 'Pulsa otra vez para confirmar' : 'Restablecer datos de ejemplo') + '</button></div>' +
    '</aside><div class="mt-main"><div class="mt-top"><div style="font-size:13px;color:#536079">' + crumb + '</div><div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">' + (topExtra || '') + '<span class="mono" style="font-size:12px;color:#536079">' + fd(Date.now()) + '</span></div></div>' +
    '<div class="mt-pg">' + msg + body + '</div></div></div>';
}
var crumb1 = function (t) { return 'METALTRACK <span style="color:#9AA6BB">/</span> <span style="color:#101828;font-weight:600">' + t + '</span>'; };
var panelHead = function (t, right) { return '<div class="mt-ph"><span>' + t + '</span>' + (right || '') + '</div>'; };
var monoR = function (t) { return '<span class="mono" style="font-weight:500;letter-spacing:0;color:#536079">' + t + '</span>'; };

/* ---------- Dashboard ---------- */
function vDashboard() {
  var O = S.orders, cnt = { p: 0, e: 0, l: 0, x: 0 }, late = [];

  'bit-go': function (el) { UI.bit = { q: el.dataset.id, type: '', page: 1 }; render(); },
  'ent-go': function (el) { UI.ent.sel = el.dataset.id; UI.ent.chip = 'por'; render(); },
  radd: function (el) { var n = el.dataset.n; if (UI.draft.route.indexOf(n) < 0) UI.draft.route.push(n); render(); },
  rup: function (el) { moveRoute(+el.dataset.i, +el.dataset.i - 1); },
  rdn: function (el) { moveRoute(+el.dataset.i, +el.dataset.i + 1); },
  rdel: function (el) { UI.draft.route.splice(+el.dataset.i, 1); render(); },
  addclient: function () {
    var n = UI.draft.client.trim();
    if (!n) return say('Escribe el nombre del cliente nuevo en el campo y pulsa + para registrarlo.', 'err');
    if (S.clients.indexOf(n) >= 0) return say('«' + n + '» ya está registrado.', 'err');
    S.clients.push(n); S.clients.sort(); UI.draft.client = n; say('Cliente «' + n + '» registrado.'); commit();
  },
  save: function () { savePedido(false); },
  save2: function () { savePedido(true); },
  draftreset: function () { UI.draft = blankDraft(); },
  entchip: function (el) { UI.ent.chip = el.dataset.chip; render(); },
  entsel: function (el) { UI.ent.sel = el.dataset.id; UI.ent.dt = ''; render(); },
  entok: function () { doEntrega(); },
  bpage: function (el) { UI.bit.page = +el.dataset.p; render(); },
  bitclear: function () { UI.bit = { q: '', type: '', page: 1 }; render(); },
  cattog: function (el) { var c = S.catalog[+el.dataset.i]; c.active = !c.active; say('«' + c.name + '» ' + (c.active ? 'activado' : 'desactivado') + '.'); commit(); },
  reset: function () {
    if (!UI.resetArm) { UI.resetArm = true; render(); setTimeout(function () { if (UI.resetArm) { UI.resetArm = false; render(); } }, 4000); return; }
    S = seed(); UI.resetArm = false; UI.segId = null; UI.piezas.sel = null; UI.draft = blankDraft(); say('Datos de ejemplo restablecidos.'); commit();
  }
};
app.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  var fn = ACT[el.dataset.a];
  if (fn) fn(el, e);
});
var dragI = null;
app.addEventListener('dragstart', function (e) {
  var r = e.target.closest && e.target.closest('[data-drag]'); if (!r) return;
  dragI = +r.dataset.drag; e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', String(dragI)); } catch (x) {}
});
app.addEventListener('dragover', function (e) { if (dragI !== null && e.target.closest && e.target.closest('[data-drag]')) e.preventDefault(); });
app.addEventListener('drop', function (e) {
  var r = e.target.closest && e.target.closest('[data-drag]'); if (!r || dragI === null) return;
  e.preventDefault(); var from = dragI; dragI = null; moveRoute(from, +r.dataset.drag);
});
app.addEventListener('dragend', function () { dragI = null; });

UI.route = routeFromHash();
render();
})();
</script>
